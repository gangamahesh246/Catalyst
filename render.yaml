services:
  - type: web
    name: talentscout-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.13
      - key: GEMINI_MODEL
        value: gemini-1.5-flash
      - key: GEMINI_API_KEY
        sync: false
